<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PT Abercode</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <header class="navbar">
      <div class="container">
        <img src="assets/Abercode logo.png" alt="Abercode Logo" class="logo" />
        <nav class="menu">
          <a href="#">Home</a>
          <a href="#">About Us</a>
          <a href="#">Services</a>
          <a href="#">Portofolio</a>
          <a href="#">Contact</a>
        </nav>
        <a href="#" class="hire-btn">Hire Us</a>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <div class="container hero-content">
        <div class="text-content">
          <h1>Innovative Tech for<br />Real Impact</h1>

          <!-- Deskripsi + Tombol disatukan agar sejajar -->
          <div class="cta-row">
            <p>
              Solusi teknologi efisien<br />
              untuk kemajuan kerja<br />
              dan pembelajaran
            </p>
            <a href="#" class="cta-btn">Selengkapnya ➝</a>
          </div>

          <!-- Dekorasi titik -->
          <img src="assets/heroelemen.png" alt="dekorasi titik" class="dots" />
        </div>

        <div class="image-wrapper">
          <img src="assets/heroimg.png" alt="Komputer" class="computer-img" />
        </div>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
